<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技术文档中心</title>
<style>
:root { --accent:#2563eb; --accent-soft:#eff6ff; --text:#1f2937; --muted:#6b7280;
        --border:#e5e7eb; --bg:#f8fafc; --card:#ffffff; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
       background:var(--bg); color:var(--text); line-height:1.75; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.container { max-width:960px; margin:0 auto; padding:24px 20px 64px; }
header.site-header { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:36px 20px; }
header.site-header .container { padding-top:0; padding-bottom:0; }
header.site-header h1 { margin:0 0 6px; font-size:26px; }
header.site-header p { margin:0; opacity:.85; font-size:14px; }
.search-box { margin:24px 0 8px; }
.search-box input { width:100%; padding:12px 16px; font-size:15px; border:1px solid var(--border);
                    border-radius:10px; outline:none; background:#fff; }
.search-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.category { margin-top:28px; }
.category h2 { font-size:19px; display:flex; align-items:center; gap:10px; margin:0 0 12px; }
.badge { font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; }
.badge-howto { background:#dcfce7; color:#15803d; }
.badge-troubleshooting { background:#fee2e2; color:#b91c1c; }
.count { color:var(--muted); font-size:13px; font-weight:400; }
ul.article-list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
ul.article-list li { background:var(--card); border:1px solid var(--border); border-radius:10px;
                     padding:14px 18px; transition:box-shadow .15s ease; }
ul.article-list li:hover { box-shadow:0 4px 14px rgba(0,0,0,.06); }
ul.article-list .title { font-size:16px; font-weight:600; }
ul.article-list .meta { font-size:12.5px; color:var(--muted); margin-top:4px; }
.empty { color:var(--muted); font-size:14px; padding:12px 4px; }
/* 文章页 */
.article-nav { margin:18px 0 0; font-size:14px; }
article.article-body { background:var(--card); border:1px solid var(--border); border-radius:12px;
                       padding:32px 40px; margin-top:16px; }
article.article-body img { max-width:100%; height:auto; border:1px solid var(--border);
                           border-radius:8px; margin:8px 0; }
article.article-body h1 { font-size:24px; margin-top:0; }
article.article-body h2 { font-size:20px; border-bottom:1px solid var(--border); padding-bottom:6px; }
article.article-body h3 { font-size:17px; }
article.article-body pre { background:#f1f5f9; padding:14px; border-radius:8px; overflow-x:auto; }
article.article-body code { background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:.92em; }
article.article-body pre code { background:none; padding:0; }
article.article-body table { border-collapse:collapse; width:100%; }
article.article-body th, article.article-body td { border:1px solid var(--border); padding:8px 12px; }
article.article-body th { background:var(--accent-soft); }
article.article-body blockquote { border-left:4px solid var(--accent); margin-left:0;
                                  padding:4px 16px; color:var(--muted); background:var(--accent-soft); }
footer.site-footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:48px; }
@media (max-width:640px) { article.article-body { padding:20px 18px; } }
</style>
</head>
<body>
<header class="site-header"><div class="container">
<h1>技术文档中心</h1>
<p>How to 操作指南 与 Troubleshooting 故障排查</p>
</div></header>
<div class="container">
<div class="search-box"><input id="search" type="search" placeholder="搜索文章标题…" oninput="filterArticles()"></div>
<section class="category"><h2><span class="badge badge-howto">How to</span>操作指南<span class="count">(1 篇)</span></h2><ul class="article-list"><li><a class="title" href="howto/如何配置每日自动备份.html">如何配置每日自动备份</a><div class="meta">How to · 更新于 2026-08-19</div></li></ul></section>
<section class="category"><h2><span class="badge badge-troubleshooting">Troubleshooting</span>故障排查<span class="count">(1 篇)</span></h2><ul class="article-list"><li><a class="title" href="troubleshooting/Troubleshooting-the-ChirpStack-v4-Unable-to-Continuously-Receive-Uplink-Data-from-Sensor.html">Troubleshooting  the ChirpStack v4 Unable to Continuously Receive Uplink Data from Sensor</a><div class="meta">Troubleshooting · 更新于 2026-08-19</div></li></ul></section>
<footer class="site-footer">共 2 篇 · 构建于 2026-08-19 16:29</footer>
</div>
<script>
function filterArticles() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('ul.article-list li').forEach(function(li) {
    li.style.display = li.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
}
</script>
</body>
</html>
