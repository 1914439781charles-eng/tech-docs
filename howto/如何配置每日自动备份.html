<style>

        --border:#e5e7eb; --bg:#f8fafc; --card:#ffffff; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
       background:var(--bg); color:var(--text); line-height:1.75; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.container { max-width:960px; margin:0 auto; padding:24px 20px 64px; }
header.site-header { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:36px 20px; }

.category { margin-top:28px; }
.category h2 { font-size:19px; display:flex; align-items:center; gap:10px; margin:0 0 12px; }
.badge { font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; }
.badge-howto { background:#dcfce7; color:#15803d; }
.badge-troubleshooting { background:#fee2e2; color:#b91c1c; }

ul.article-list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
ul.article-list li { background:var(--card); border:1px solid var(--border); border-radius:10px;

ul.article-list li:hover { box-shadow:0 4px 14px rgba(0,0,0,.06); }
ul.article-list .title { font-size:16px; font-weight:600; }
ul.article-list .meta { font-size:12.5px; color:var(--muted); margin-top:4px; }
.empty { color:var(--muted); font-size:14px; padding:12px 4px; }
/* 文章页 */
.article-nav { margin:18px 0 0; font-size:14px; }
article.article-body { background:var(--card); border:1px solid var(--border); border-radius:12px;
                       padding:32px 40px; margin-top:16px; }
article.article-body img { max-width:100%; height:auto; border:1px solid var(--border);

article.article-body code { background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:.92em; }
article.article-body pre code { background:none; padding:0; }
article.article-body table { border-collapse:collapse; width:100%; }
article.article-body th, article.article-body td { border:1px solid var(--border); padding:8px 12px; }
article.article-body th { background:var(--accent-soft); }

<h1 id="如何配置每日自动备份">如何配置每日自动备份</h1>
<p>本文介绍如何配置系统的每日自动备份任务。</p>
<h2 id="操作步骤">操作步骤</h2>
<ol type="1">
<li>打开「设置 - 数据管理」页面</li>
<li>点击「新增备份计划」</li>
<li>选择备份时间与存储位置</li>
<li>保存并启用</li>
</ol>
<h2 id="界面示意">界面示意</h2>

</figure>
<p>配置完成后, 系统会在每天指定时间自动执行备份。</p>

</article>
